[project]
name = "dayboard"
version = "0.1.0"
description = "달력·날씨·해/달·천체 스와이프 표출 보드 (server-manager fixture)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.0",
    "waitress>=3.0.0",
    "requests>=2.32.0",
    "astral>=3.2",
    "holidays>=0.101",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dayboard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
