<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>dayboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <button id="theme-btn" class="theme-btn" aria-label="테마 전환"></button>
  <div id="track" class="track">
    <section class="page" id="page-calendar"><h1 class="ttl">달력</h1><div class="body" id="cal"></div></section>
    <section class="page" id="page-weather"><h1 class="ttl">날씨</h1>
      <div class="body"><div id="wx"></div><div id="sm" class="sm-block"></div></div></section>
    <section class="page" id="page-sky"><h1 class="ttl">천체</h1><button id="filter-btn" class="filter-btn">필터</button>
      <div id="filter-panel" class="filter-panel hidden"></div>
      <div class="body" id="sky"></div></section>
  </div>
  <div class="dots" id="dots"></div>
  <script src="/static/app.js"></script>
</body>
</html>
